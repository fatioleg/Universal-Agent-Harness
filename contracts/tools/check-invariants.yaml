tool_id: check-invariants
capability: invariant-verification
input_schema: |
  Path to a project root containing harness.lock.yaml.
output_schema: |
  A pass-or-fail verdict plus per-invariant status.
permissions_required:
  - read
side_effects: none
failure_modes:
  - mode: missing-lock-file
    detection: lock file not found
    recovery: report BLOCK and ask human to run scaffold-project
  - mode: schema-violation
    detection: lock file fails resolved-harness.schema.json
    recovery: report the violation; do not modify
  - mode: invariant-violation
    detection: lock grants capabilities that conflict with a locked invariant
    recovery: report the conflict; require human decision
cost_estimate: "negligible (file read + schema parse)"
latency_estimate: "< 1 s"
validation_method: "deterministic schema + invariant check"
eval_status: untested